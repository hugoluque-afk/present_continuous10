<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>English Elegance: Present Continuous Masterclass</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;1,600&family=Poppins:wght@300;400;500;600&display=swap');

        :root {
            --primary: #FF7EB3;
            --secondary: #FF758C;
            --bg-gradient: linear-gradient(135deg, #fbc2eb 0%, #a6c1ee 100%);
            --text-main: #333;
            --white: #ffffff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none; /* Previene la selección de texto */
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: var(--bg-gradient);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--text-main);
            overflow: hidden;
        }

        .container {
            background: rgba(255, 255, 255, 0.95);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
            width: 90%;
            max-width: 600px;
            text-align: center;
            transition: all 0.3s ease;
        }

        h1 {
            font-family: 'Playfair Display', serif;
            color: var(--primary);
            font-size: 2.5rem;
            margin-bottom: 10px;
        }

        p.subtitle {
            font-size: 1rem;
            color: #666;
            margin-bottom: 30px;
        }

        /* Buscador */
        .search-container {
            position: relative;
            margin-bottom: 25px;
            text-align: left;
        }

        .search-container label {
            font-size: 0.9rem;
            color: var(--secondary);
            font-weight: 500;
        }

        input[type="text"] {
            width: 100%;
            padding: 15px;
            margin-top: 5px;
            border: 2px solid #ffb6c1;
            border-radius: 10px;
            font-size: 1rem;
            font-family: 'Poppins', sans-serif;
            outline: none;
            transition: border-color 0.3s;
        }

        input[type="text"]:focus {
            border-color: var(--primary);
        }

        #user-list {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: var(--white);
            border: 1px solid #eee;
            border-radius: 10px;
            max-height: 200px;
            overflow-y: auto;
            z-index: 10;
            box-shadow: 0 5px 15px rgba(0,0,0,0.05);
            display: none;
        }

        #user-list div {
            padding: 12px 15px;
            cursor: pointer;
            border-bottom: 1px solid #f5f5f5;
            transition: background 0.2s;
        }

        #user-list div:hover {
            background: #fff0f5;
            color: var(--primary);
        }

        /* Botones */
        button {
            background: linear-gradient(to right, var(--secondary), var(--primary));
            color: var(--white);
            border: none;
            padding: 15px 30px;
            font-size: 1.1rem;
            border-radius: 30px;
            cursor: pointer;
            font-weight: 600;
            width: 100%;
            transition: transform 0.2s, box-shadow 0.2s;
            font-family: 'Poppins', sans-serif;
            margin-top: 10px;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(255, 117, 140, 0.4);
        }

        button:disabled {
            background: #ccc;
            cursor: not-allowed;
            box-shadow: none;
            transform: none;
        }

        /* Juego UI */
        .hidden { display: none !important; }
        
        .game-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
            font-weight: 600;
            color: var(--secondary);
            border-bottom: 2px solid #fff0f5;
            padding-bottom: 10px;
        }

        .question-box {
            font-size: 1.4rem;
            margin-bottom: 30px;
            font-weight: 500;
        }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .option-btn {
            background: var(--white);
            color: var(--text-main);
            border: 2px solid #ffb6c1;
            padding: 15px;
            border-radius: 15px;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s;
        }

        .option-btn:hover {
            background: #fff0f5;
            border-color: var(--primary);
        }

        /* Anti-plagio footer */
        .anti-cheat-warning {
            font-size: 0.75rem;
            color: #ff4d4d;
            margin-top: 20px;
        }

        /* Leaderboard */
        .leaderboard-box {
            background: #fff0f5;
            padding: 20px;
            border-radius: 15px;
            margin-top: 20px;
        }

        .leaderboard-box h3 {
            color: var(--primary);
            margin-bottom: 10px;
        }

        /* Responsive */
        @media (max-width: 600px) {
            .options-grid { grid-template-columns: 1fr; }
            h1 { font-size: 2rem; }
        }
    </style>
</head>
<body>

    <!-- PANTALLA DE INICIO -->
    <div id="screen-login" class="container">
        <h1>English Elegance</h1>
        <p class="subtitle">Present Continuous Masterclass</p>

        <div class="search-container">
            <label>Busca y selecciona tu nombre:</label>
            <input type="text" id="searchInput" placeholder="Haz clic o escribe para buscar..." autocomplete="off">
            <div id="user-list"></div>
        </div>

        <button id="btnStart" disabled>COMENZAR AVENTURA</button>
        <p class="anti-cheat-warning">🛡️ Sistema Anti-Plagio Activado. No salgas de la pantalla.</p>
    </div>

    <!-- PANTALLA DE JUEGO -->
    <div id="screen-game" class="container hidden">
        <div class="game-header">
            <span id="level-display">Nivel 1</span>
            <span id="score-display">Puntos: 0</span>
        </div>
        <div class="question-box" id="question-text">
            Cargando pregunta...
        </div>
        <div class="options-grid" id="options-container">
            <!-- Botones generados dinámicamente -->
        </div>
    </div>

    <!-- PANTALLA DE RESULTADOS -->
    <div id="screen-result" class="container hidden">
        <h1>¡Completado!</h1>
        <p class="subtitle" id="final-message"></p>
        
        <div class="leaderboard-box">
            <h3>Tu Puntuación Final</h3>
            <h2 id="final-score" style="font-size: 2.5rem; color: #333;">0</h2>
            <p id="cheat-report" style="color: #ff4d4d; font-size: 0.9rem; margin-top:10px;"></p>
        </div>

        <p id="save-status" style="margin-top: 20px; color: #666;">Guardando resultados en la base de datos...</p>
    </div>
